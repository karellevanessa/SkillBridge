<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillBridge PH — Employer Dashboard</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #F5F7FA; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 99px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn .3s ease both; }
    .card-hover { transition: transform .18s ease, box-shadow .18s ease; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(31,78,121,.1); }
    .btn { transition: filter .15s ease, transform .1s ease; cursor: pointer; }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: scale(.97); }
    .sidebar-item { transition: background .15s, color .15s; }
    .sidebar-item:hover { background: rgba(255,255,255,.08); }
    @keyframes pulse-dot { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.5; transform:scale(1.3); } }
    .pulse-dot { animation: pulse-dot 1.6s ease-in-out infinite; }
    .credly-badge { background: linear-gradient(135deg,#FF6B2B 0%,#FF8C42 100%); }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const C = {
  navy:    '#1F4E79',
  navyDk:  '#163856',
  teal:    '#1D9E75',
  tealLt:  '#E8F8F2',
  sky:     '#2E75B6',
  skyLt:   '#EAF3FB',
  warn:    '#F59E0B',
  warnLt:  '#FFFBEB',
  danger:  '#EF4444',
  gray:    '#6B7280',
  grayLt:  '#F3F4F6',
  green:   '#10B981',
  greenLt: '#ECFDF5',
  purple:  '#7C3AED',
  purpleLt:'#EDE9FE',
};

const Ico = {
  Home:    <svg viewBox="0 0 20 20" fill="currentColor" className="w-5 h-5"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>,
  Users:   <svg viewBox="0 0 20 20" fill="currentColor" className="w-5 h-5"><path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z"/></svg>,
  Team:    <svg viewBox="0 0 20 20" fill="currentColor" className="w-5 h-5"><path fillRule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clipRule="evenodd"/></svg>,
  Brief:   <svg viewBox="0 0 20 20" fill="currentColor" className="w-5 h-5"><path fillRule="evenodd" d="M6 6V5a3 3 0 013-3h2a3 3 0 013 3v1h2a2 2 0 012 2v3.57A22.952 22.952 0 0110 13a22.95 22.95 0 01-8-1.43V8a2 2 0 012-2h2zm2-1a1 1 0 011-1h2a1 1 0 011 1v1H8V5zm1 5a1 1 0 011-1h.01a1 1 0 110 2H10a1 1 0 01-1-1z" clipRule="evenodd"/><path d="M2 13.692V16a2 2 0 002 2h12a2 2 0 002-2v-2.308A24.974 24.974 0 0110 15c-2.796 0-5.487-.46-8-1.308z"/></svg>,
  Chart:   <svg viewBox="0 0 20 20" fill="currentColor" className="w-5 h-5"><path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/></svg>,
  Gear:    <svg viewBox="0 0 20 20" fill="currentColor" className="w-5 h-5"><path fillRule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clipRule="evenodd"/></svg>,
  Bell:    <svg viewBox="0 0 20 20" fill="currentColor" className="w-5 h-5"><path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"/></svg>,
  Check:   <svg viewBox="0 0 16 16" fill="currentColor" className="w-4 h-4"><path fillRule="evenodd" d="M12.416 3.376a.75.75 0 01.208 1.04l-5 7.5a.75.75 0 01-1.154.114l-3-3a.75.75 0 011.06-1.06l2.353 2.353 4.493-6.74a.75.75 0 011.04-.207z" clipRule="evenodd"/></svg>,
  Shield:  <svg viewBox="0 0 20 20" fill="currentColor" className="w-4 h-4"><path fillRule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd"/></svg>,
  Arrow:   <svg viewBox="0 0 20 20" fill="currentColor" className="w-4 h-4"><path fillRule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clipRule="evenodd"/></svg>,
  Loc:     <svg viewBox="0 0 20 20" fill="currentColor" className="w-3.5 h-3.5"><path fillRule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clipRule="evenodd"/></svg>,
  Download:<svg viewBox="0 0 20 20" fill="currentColor" className="w-4 h-4"><path fillRule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clipRule="evenodd"/></svg>,
  Plus:    <svg viewBox="0 0 20 20" fill="currentColor" className="w-4 h-4"><path fillRule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clipRule="evenodd"/></svg>,
  Eye:     <svg viewBox="0 0 20 20" fill="currentColor" className="w-4 h-4"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fillRule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clipRule="evenodd"/></svg>,
};

const Avatar = ({ initials = 'SB', size = 40, bg = C.sky, textSize = 14 }) => (
  <div style={{ width: size, height: size, borderRadius: '50%', background: bg, display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontWeight: 800, fontSize: textSize, flexShrink: 0, letterSpacing: '.5px' }}>
    {initials}
  </div>
);

const Pill = ({ children, color, bg, size = 'sm' }) => (
  <span style={{ color, background: bg, borderRadius: 99, padding: size === 'xs' ? '2px 8px' : '3px 10px', fontSize: size === 'xs' ? 10 : 11, fontWeight: 700, letterSpacing: '.3px', whiteSpace: 'nowrap', display: 'inline-flex', alignItems: 'center', gap: 4 }}>
    {children}
  </span>
);

const Bar = ({ pct, color = C.sky, height = 8, bg = '#E5E7EB' }) => (
  <div style={{ width: '100%', height, background: bg, borderRadius: 99, overflow: 'hidden' }}>
    <div style={{ width: `${pct}%`, height: '100%', background: color, borderRadius: 99, transition: 'width .6s cubic-bezier(.4,0,.2,1)' }} />
  </div>
);

const Ring = ({ pct, size = 80, stroke = 8, color = C.sky, bg = '#E5E7EB', children }) => {
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const dash = circ * (1 - pct / 100);
  return (
    <div style={{ position: 'relative', width: size, height: size, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
      <svg width={size} height={size} style={{ position: 'absolute', top: 0, left: 0, transform: 'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={bg} strokeWidth={stroke} />
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeDasharray={circ} strokeDashoffset={dash} strokeLinecap="round" style={{ transition: 'stroke-dashoffset .8s' }} />
      </svg>
      <div style={{ position: 'relative', zIndex: 1, textAlign: 'center' }}>{children}</div>
    </div>
  );
};

const Card = ({ children, style = {}, hover = true }) => (
  <div className={hover ? 'card-hover' : ''} style={{ background: '#fff', borderRadius: 16, border: '1px solid #E9EEF4', boxShadow: '0 1px 4px rgba(0,0,0,.05)', overflow: 'hidden', ...style }}>
    {children}
  </div>
);

const SectionHeader = ({ title, subtitle, action }) => (
  <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 20, gap: 12 }}>
    <div>
      <h2 style={{ fontSize: 20, fontWeight: 800, color: '#111827', letterSpacing: '-.3px' }}>{title}</h2>
      {subtitle && <p style={{ fontSize: 13, color: C.gray, marginTop: 3 }}>{subtitle}</p>}
    </div>
    {action}
  </div>
);

const TopBar = ({ title, subtitle, right }) => (
  <div style={{ background: '#fff', borderBottom: '1px solid #E9EEF4', padding: '14px 28px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', position: 'sticky', top: 0, zIndex: 20, boxShadow: '0 1px 3px rgba(0,0,0,.04)' }}>
    <div>
      <div style={{ fontSize: 17, fontWeight: 800, color: '#111827', letterSpacing: '-.2px' }}>{title}</div>
      {subtitle && <div style={{ fontSize: 12, color: C.gray, marginTop: 1 }}>{subtitle}</div>}
    </div>
    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
      {right}
      <button style={{ position: 'relative', width: 36, height: 36, borderRadius: 10, background: '#F8FAFC', border: '1px solid #E9EEF4', display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.gray, cursor: 'pointer' }} className="btn">
        {Ico.Bell}
        <span style={{ position: 'absolute', top: 7, right: 7, width: 7, height: 7, borderRadius: '50%', background: '#EF4444', border: '1.5px solid #fff' }} />
      </button>
      <Avatar initials="SB" size={36} bg={C.sky} textSize={12} />
    </div>
  </div>
);

const CredlyBadge = () => (
  <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, background: 'linear-gradient(135deg,#FF6B2B,#FF8C42)', color: '#fff', borderRadius: 6, padding: '2px 8px', fontSize: 10, fontWeight: 800, letterSpacing: '.4px' }}>
    ✦ CREDLY VERIFIED
  </span>
);

/* ══ SIDEBAR ══ */
const NAV = [
  { id: 'overview',   label: 'Overview',           icon: Ico.Home  },
  { id: 'talent',     label: 'Talent Pool',         icon: Ico.Users },
  { id: 'workforce',  label: 'Internal Workforce',  icon: Ico.Team  },
  { id: 'postings',   label: 'Job Postings',        icon: Ico.Brief },
  { id: 'reports',    label: 'Reports & ROI',       icon: Ico.Chart },
  { id: 'settings',   label: 'Settings',            icon: Ico.Gear  },
];

function Sidebar({ active, onNav }) {
  return (
    <div style={{ width: 232, minHeight: '100vh', background: C.navy, display: 'flex', flexDirection: 'column', flexShrink: 0 }}>
      {/* Brand */}
      <div style={{ padding: '20px 18px 16px', borderBottom: '1px solid rgba(255,255,255,.08)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ width: 36, height: 36, borderRadius: 10, background: C.sky, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 900, color: '#fff', fontSize: 13, flexShrink: 0 }}>SB</div>
          <div>
            <div style={{ color: '#fff', fontWeight: 900, fontSize: 15, letterSpacing: '-.3px', lineHeight: 1 }}>SkillBridge</div>
            <div style={{ color: C.sky, fontSize: 9, fontWeight: 800, letterSpacing: '1.8px', marginTop: 2 }}>EMPLOYER</div>
          </div>
        </div>
      </div>

      {/* Company card */}
      <div style={{ padding: '14px 14px 12px', borderBottom: '1px solid rgba(255,255,255,.08)' }}>
        <div style={{ background: 'rgba(255,255,255,.07)', borderRadius: 12, padding: '10px 12px', display: 'flex', alignItems: 'center', gap: 10 }}>
          <Avatar initials="SB" size={36} bg={C.sky} textSize={12} />
          <div style={{ minWidth: 0 }}>
            <div style={{ color: '#fff', fontWeight: 700, fontSize: 13, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>Stellar BPO PH</div>
            <div style={{ color: '#93C5FD', fontSize: 11, marginTop: 1 }}>Enterprise Plan · Taguig</div>
          </div>
          <div style={{ marginLeft: 'auto' }}>
            <div style={{ background: C.teal, borderRadius: 6, padding: '1px 6px', color: '#fff', fontSize: 9, fontWeight: 800, letterSpacing: '.5px' }}>ACTIVE</div>
          </div>
        </div>
      </div>

      {/* Nav */}
      <nav style={{ flex: 1, padding: '10px 10px' }}>
        {NAV.map(n => {
          const on = active === n.id;
          return (
            <button key={n.id} onClick={() => onNav(n.id)} className="sidebar-item"
              style={{ width: '100%', display: 'flex', alignItems: 'center', gap: 10, padding: '9px 10px', borderRadius: 10, marginBottom: 2, cursor: 'pointer', border: 'none', textAlign: 'left', background: on ? 'rgba(46,117,182,.3)' : 'transparent', color: on ? '#fff' : 'rgba(255,255,255,.6)', fontWeight: on ? 700 : 500, fontSize: 13, fontFamily: 'inherit', position: 'relative' }}>
              <span style={{ color: on ? '#60A5FA' : 'rgba(255,255,255,.5)', flexShrink: 0 }}>{n.icon}</span>
              {n.label}
              {on && <span style={{ position: 'absolute', left: 0, top: '50%', transform: 'translateY(-50%)', width: 3, height: 18, borderRadius: '0 3px 3px 0', background: C.sky }} />}
            </button>
          );
        })}
      </nav>

      {/* Seat usage + back to home */}
      <div style={{ padding: '8px 10px 6px', borderTop: '1px solid rgba(255,255,255,.08)' }}>
        <div style={{ padding: '10px 10px 12px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', color: 'rgba(255,255,255,.45)', fontSize: 10, marginBottom: 5 }}>
            <span>42 / 60 seats used</span><span>Enterprise</span>
          </div>
          <Bar pct={70} color={C.sky} height={4} bg="rgba(255,255,255,.12)" />
          <div style={{ color: 'rgba(255,255,255,.25)', fontSize: 9, marginTop: 8, textAlign: 'center', letterSpacing: '.5px' }}>SKILLBRIDGE PH PARTNER</div>
        </div>
        <div style={{ padding: '0 0 16px' }}>
          <a href="../index.html" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, width: '100%', padding: '9px', borderRadius: 10, background: 'rgba(255,255,255,.06)', border: '1px solid rgba(255,255,255,.1)', color: 'rgba(255,255,255,.45)', fontSize: 12, fontWeight: 600, textDecoration: 'none' }}
            onMouseEnter={e => e.currentTarget.style.background='rgba(255,255,255,.12)'}
            onMouseLeave={e => e.currentTarget.style.background='rgba(255,255,255,.06)'}>
            ← Back to Home
          </a>
        </div>
      </div>
    </div>
  );
}

/* ══ SCREEN 1: OVERVIEW ══ */
function Overview() {
  const metrics = [
    { label: 'Candidates Ready to Hire', value: '14', sub: '↑ 6 this week', color: C.teal, bg: C.tealLt, emoji: '🎯' },
    { label: 'Sponsored Employees Active', value: '42', sub: '18 on track for cert', color: C.sky, bg: C.skyLt, emoji: '📚' },
    { label: 'Avg. Cost-Per-Hire Reduction', value: '38%', sub: 'vs. traditional recruitment', color: C.green, bg: C.greenLt, emoji: '💰' },
    { label: 'Open Roles Matched', value: '7/9', sub: '2 roles need more candidates', color: C.warn, bg: C.warnLt, emoji: '📋' },
  ];

  const feed = [
    { text: 'Maria Reyes completed Data Analyst certification', time: '2 hours ago', color: C.teal, emoji: '🏅' },
    { text: '3 new candidates match your Cloud Engineer posting', time: '4 hours ago', color: C.sky, emoji: '⚡' },
    { text: 'Carlo Santos is 90% through the Cybersecurity pathway', time: 'Yesterday', color: C.purple, emoji: '🔐' },
    { text: 'Ana Dela Cruz earned her Google Data Analytics badge', time: 'Yesterday', color: C.teal, emoji: '✦' },
    { text: 'New batch of 8 candidates entered the talent pool', time: '2 days ago', color: C.gray, emoji: '👥' },
  ];

  return (
    <div className="fade-in">
      <TopBar title="Overview" subtitle="Miyerkules, Abril 1, 2026" />
      <div style={{ padding: '24px 28px', maxWidth: 1080 }}>

        {/* Hero */}
        <div style={{ borderRadius: 18, background: `linear-gradient(130deg,${C.navy} 0%,#1A4268 100%)`, padding: '28px 32px', color: '#fff', marginBottom: 20, position: 'relative', overflow: 'hidden' }}>
          <div style={{ position: 'absolute', right: -30, top: -30, width: 200, height: 200, borderRadius: '50%', background: 'rgba(255,255,255,.04)' }} />
          <div style={{ position: 'relative' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
              <span style={{ background: 'rgba(46,117,182,.4)', borderRadius: 6, padding: '2px 8px', fontSize: 11, fontWeight: 700, color: '#93C5FD' }}>EMPLOYER COMMAND CENTER</span>
            </div>
            <h1 style={{ fontSize: 24, fontWeight: 900, letterSpacing: '-.4px', marginBottom: 6 }}>Good morning, Stellar BPO Philippines 👋</h1>
            <p style={{ fontSize: 14, color: 'rgba(255,255,255,.7)', maxWidth: 520, lineHeight: 1.6 }}>
              You have <strong style={{ color: '#60A5FA' }}>14 pre-vetted candidates</strong> ready for interview today — all Credly-verified, zero screening needed.
            </p>
            <div style={{ display: 'flex', gap: 8, marginTop: 16, flexWrap: 'wrap' }}>
              {['🔥 3 certs earned this week', '⚡ 42 active learners', '📋 7 roles matched', '💼 2 hires this month'].map(t => (
                <span key={t} style={{ background: 'rgba(255,255,255,.1)', borderRadius: 8, padding: '5px 10px', fontSize: 12, fontWeight: 600 }}>{t}</span>
              ))}
            </div>
          </div>
        </div>

        {/* Alert */}
        <div style={{ background: C.skyLt, border: `1.5px solid #BFDBFE`, borderRadius: 12, padding: '12px 16px', marginBottom: 20, display: 'flex', alignItems: 'center', gap: 10 }}>
          <span style={{ fontSize: 18 }}>⚡</span>
          <p style={{ fontSize: 13, color: '#1E40AF', fontWeight: 600, flex: 1 }}>
            <strong>14 candidates are interview-ready now</strong> — all have completed their certification pathway and passed proctored assessments.
          </p>
          <button className="btn" style={{ flexShrink: 0, background: C.sky, color: '#fff', border: 'none', borderRadius: 8, padding: '7px 14px', fontSize: 12, fontWeight: 700 }}>View Talent Pool →</button>
        </div>

        {/* Metric tiles */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 14, marginBottom: 20 }}>
          {metrics.map(m => (
            <Card key={m.label} style={{ padding: '18px 20px' }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
                <span style={{ fontSize: 24 }}>{m.emoji}</span>
                <Pill color={m.color} bg={m.bg} size="xs">{m.sub}</Pill>
              </div>
              <div style={{ fontSize: 30, fontWeight: 900, color: m.color, letterSpacing: '-.5px', lineHeight: 1 }}>{m.value}</div>
              <div style={{ fontSize: 12, color: C.gray, marginTop: 4, fontWeight: 500 }}>{m.label}</div>
            </Card>
          ))}
        </div>

        {/* Activity feed */}
        <SectionHeader title="Live Activity Feed" subtitle="Real-time updates on your talent pipeline" />
        <Card style={{ padding: 0 }} hover={false}>
          {feed.map((f, i) => (
            <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '14px 20px', borderBottom: i < feed.length - 1 ? '1px solid #F3F4F6' : 'none' }}>

                    <span style={{ fontWeight: 800, color: m.color }}>{m.sb}%</span>
                  </div>
                  <Bar pct={m.sb} color={m.color} height={10} />
                </div>
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4, fontSize: 12 }}>
                    <span style={{ color: '#9CA3AF', fontWeight: 600 }}>Company baseline</span>
                    <span style={{ fontWeight: 700, color: '#9CA3AF' }}>{m.base}%</span>
                  </div>
                  <Bar pct={m.base} color="#D1D5DB" height={10} />
                </div>
              </div>
            ))}
          </div>
        </Card>
      </div>
    </div>
  );
}

/* ══ SCREEN 6: SETTINGS ══ */
function Settings() {
  const [notif, setNotif] = useState(true);
  const [pipeline, setPipeline] = useState(true);
  const [hris, setHris] = useState(false);

  const Toggle = ({ on, onToggle }) => (
    <div onClick={onToggle} style={{ width: 44, height: 24, borderRadius: 99, background: on ? C.sky : '#E5E7EB', cursor: 'pointer', position: 'relative', transition: 'background .2s', flexShrink: 0 }}>
      <div style={{ position: 'absolute', top: 3, left: on ? 23 : 3, width: 18, height: 18, borderRadius: '50%', background: '#fff', boxShadow: '0 1px 3px rgba(0,0,0,.2)', transition: 'left .2s' }} />
    </div>
  );

  return (
    <div className="fade-in">
      <TopBar title="Settings" subtitle="Manage your SkillBridge PH employer account" />
      <div style={{ padding: '24px 28px', maxWidth: 680 }}>
        <Card style={{ padding: 22, marginBottom: 16 }} hover={false}>
          <div style={{ fontWeight: 800, color: '#111827', fontSize: 14, marginBottom: 14 }}>Account</div>
          {[
            ['Company', 'Stellar BPO Philippines, Inc.'],
            ['Plan', 'Enterprise — 60 seats'],
            ['Primary Contact', 'HR Director, talent@stellarbpo.com.ph'],
            ['Member Since', 'October 2025'],
          ].map(([k, v]) => (
            <div key={k} style={{ display: 'flex', borderBottom: '1px solid #F3F4F6', padding: '10px 0', gap: 16 }}>
              <div style={{ width: 160, fontSize: 12, color: '#9CA3AF', fontWeight: 600 }}>{k}</div>
              <div style={{ flex: 1, fontSize: 13, fontWeight: 600, color: '#374151' }}>{v}</div>
            </div>
          ))}
        </Card>

        {[
          { title: 'Notifications', items: [
            { label: 'Candidate Match Alerts', sub: 'Notify when new candidates match your open roles', on: notif, set: setNotif },
            { label: 'Talent Pipeline Updates', sub: 'Employee cert completions and status changes', on: pipeline, set: setPipeline },
          ]},
          { title: 'Integrations', items: [
            { label: 'HRIS Sync (SAP / Workday)', sub: 'Auto-sync SkillBridge data to your HR system', on: hris, set: setHris },
          ]},
        ].map(g => (
          <Card key={g.title} style={{ padding: 22, marginBottom: 16 }} hover={false}>
            <div style={{ fontWeight: 800, color: '#111827', fontSize: 14, marginBottom: 14 }}>{g.title}</div>
            {g.items.map(item => (
              <div key={item.label} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 0', borderBottom: '1px solid #F3F4F6', gap: 12 }}>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: '#374151' }}>{item.label}</div>
                  <div style={{ fontSize: 11, color: '#9CA3AF', marginTop: 2 }}>{item.sub}</div>
                </div>
                <Toggle on={item.on} onToggle={() => item.set(v => !v)} />
              </div>
            ))}
          </Card>
        ))}

        <Card style={{ padding: 22 }} hover={false}>
          <div style={{ fontWeight: 800, color: '#111827', fontSize: 14, marginBottom: 14 }}>Billing & Seats</div>
          {['Manage Subscription', 'Add Seats', 'View Invoices', 'Cancel Plan'].map((a, i) => (
            <button key={a} className="btn" style={{ display: 'block', width: '100%', textAlign: 'left', background: 'transparent', border: 'none', borderBottom: i < 3 ? '1px solid #F3F4F6' : 'none', padding: '11px 0', fontSize: 13, fontWeight: 600, color: i === 3 ? '#EF4444' : '#374151', cursor: 'pointer', fontFamily: 'inherit' }}>{a} →</button>
          ))}
        </Card>
      </div>
    </div>
  );
}

/* ══ APP ROOT ══ */
function App() {
  const [screen, setScreen] = useState('overview');
  const SCREENS = {
    overview:  <Overview />,
    talent:    <TalentPool />,
    workforce: <InternalWorkforce />,
    postings:  <JobPostings />,
    reports:   <ReportsROI />,
    settings:  <Settings />,
  };
  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden', fontFamily: 'Inter, system-ui, sans-serif' }}>
      <Sidebar active={screen} onNav={setScreen} />
      <main style={{ flex: 1, overflowY: 'auto', background: '#F5F7FA' }}>
        {SCREENS[screen]}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
