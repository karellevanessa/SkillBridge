<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillBridge PH — AI Career Ecosystem</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #F0F4F8; color: #111827; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 99px; }

    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(1.5);} }

    .fade-in   { animation: fadeUp .3s ease both; }
    .pulse-dot { animation: pulseDot 1.8s ease-in-out infinite; }
    .hover-lift { transition: transform .18s ease, box-shadow .18s ease; cursor: pointer; }
    .hover-lift:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(30,58,95,.1); }
    .btn { transition: filter .15s, transform .1s; cursor: pointer; font-family: inherit; }
    .btn:hover { filter: brightness(1.06); }
    .btn:active { transform: scale(.97); }
    .nav-link { transition: color .15s; }

    /* ── Mobile responsive ── */
    .r-page    { padding: 56px 40px 60px; }
    .r-page-sm { padding: 40px 40px; }
    .r-ph      { padding: 20px 40px; }
    .r-grid-2  { display: grid; grid-template-columns: 1fr 1.35fr; gap: 24px; margin-bottom: 24px; }
    .r-grid-2b { display: grid; grid-template-columns: 1.6fr 1fr; gap: 24px; }
    .r-grid-2c { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 28px; }
    .r-grid-3  { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-bottom: 28px; }
    .r-nav     { display: flex; align-items: center; padding: 0 40px; height: 60px; max-width: 1280px; margin: 0 auto; width: 100%; }
    .r-navlinks { display: flex; align-items: center; gap: 2px; }
    .r-navright { display: flex; align-items: center; gap: 12px; margin-left: auto; }
    .r-hero-h1  { font-size: 52px; }

    @media (max-width: 768px) {
      .r-page    { padding: 24px 16px 32px; }
      .r-page-sm { padding: 20px 16px; }
      .r-ph      { padding: 14px 16px; flex-wrap: wrap; }
      .r-grid-2  { grid-template-columns: 1fr; }
      .r-grid-2b { grid-template-columns: 1fr; }
      .r-grid-2c { grid-template-columns: 1fr; }
      .r-grid-3  { grid-template-columns: 1fr; }
      .r-nav     { padding: 0 16px; }
      .r-navlinks { display: none; }
      .r-navright { display: none; }
      .r-hero-h1  { font-size: 30px; letter-spacing: -.4px; }
      .r-mob-nav  { display: flex !important; }
    }
    .r-mob-nav { display: none; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const C = {
  navy:'#1E3A5F', teal:'#2A9D76', tealLt:'#E6F5F0',
  gold:'#C89B3C', sky:'#2E75B6', skyLt:'#EAF3FB',
  warn:'#D97706', gray:'#6B7280', grayLt:'#F3F4F6',
  green:'#16A34A', greenLt:'#DCFCE7',
  red:'#DC2626', purple:'#7C3AED', purpleLt:'#F5F3FF', bg:'#F0F4F8',
};

/* Brand logo SVG — kept because it IS the brand mark, not a UI icon */
const Logo = () => (
  <div style={{ display:'flex', alignItems:'center', gap:10 }}>
    <svg width="36" height="36" viewBox="0 0 48 48" fill="none">
      <rect width="48" height="48" rx="11" fill="#2A9D76"/>
      <path d="M10 36 Q14 20 24 18 Q34 16 38 10" stroke="white" strokeWidth="3.5" strokeLinecap="round" fill="none"/>
      <circle cx="10" cy="36" r="4" fill="white" opacity="0.5"/>
      <circle cx="34" cy="13" r="5" fill="#C89B3C"/>
      <circle cx="34" cy="13" r="3" fill="#E8B84B"/>
    </svg>
    <div style={{ lineHeight:1 }}>
      <div style={{ fontFamily:"'DM Serif Display', Georgia, serif", fontSize:18, display:'flex', alignItems:'baseline' }}>
        <span style={{ color:C.navy }}>Skill</span>
        <span style={{ color:C.teal }}>&nbsp;Bridge</span>
        <span style={{ color:C.gold }}>&nbsp;PH</span>
      </div>
      <div style={{ fontSize:9.5, color:C.gray, fontWeight:500, marginTop:2, letterSpacing:'.2px' }}>A Talent Development Ecosystem</div>
    </div>
  </div>
);

const Avatar = ({ initials='MR', size=36, bg=C.teal, fs=13 }) => (
  <div style={{ width:size, height:size, borderRadius:'50%', background:bg, display:'flex', alignItems:'center', justifyContent:'center', color:'#fff', fontWeight:800, fontSize:fs, flexShrink:0, letterSpacing:'.3px' }}>{initials}</div>
);

/* Text tag — colored label, zero icon */
const Tag = ({ children, color, bg, border }) => (
  <span style={{ color, background:bg, border:border?`1px solid ${border}`:undefined, borderRadius:6, padding:'3px 10px', fontSize:11, fontWeight:700, whiteSpace:'nowrap', letterSpacing:'.2px', display:'inline-block' }}>{children}</span>
);

const Bar = ({ pct, color=C.teal, h=8, bg='#E5E7EB' }) => (
  <div style={{ width:'100%', height:h, background:bg, borderRadius:99, overflow:'hidden' }}>
    <div style={{ width:`${pct}%`, height:'100%', background:color, borderRadius:99, transition:'width .6s cubic-bezier(.4,0,.2,1)' }}/>
  </div>
);

const Ring = ({ pct, size=100, stroke=8, color=C.teal, bg='#E5E7EB', children }) => {
  const r=(size-stroke)/2, circ=2*Math.PI*r, dash=circ*(1-pct/100);
  return (
    <div style={{ position:'relative', width:size, height:size, display:'inline-flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
      <svg width={size} height={size} style={{ position:'absolute', top:0, left:0, transform:'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={bg} strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeDasharray={circ} strokeDashoffset={dash} strokeLinecap="round" style={{ transition:'stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)' }}/>
      </svg>
      <div style={{ position:'relative', zIndex:1, textAlign:'center' }}>{children}</div>
    </div>
  );
};

const Card = ({ children, style={}, hover=true }) => (
  <div className={hover?'hover-lift':''} style={{ background:'#fff', borderRadius:14, border:'1px solid #E2E8F0', boxShadow:'0 1px 3px rgba(0,0,0,.04)', ...style }}>{children}</div>
);

const SectionHeader = ({ title, subtitle, action }) => (
  <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:20, gap:12 }}>
    <div>
      <h2 style={{ fontSize:18, fontWeight:800, color:'#111827', letterSpacing:'-.3px' }}>{title}</h2>
      {subtitle && <p style={{ fontSize:12, color:C.gray, marginTop:3 }}>{subtitle}</p>}
    </div>
    {action}
  </div>
);

/* TOP NAV */
const NAV = [
  { id:'dashboard',   label:'Dashboard'   },
  { id:'careermap',   label:'Career Map'  },
  { id:'modules',     label:'Learning'    },
  { id:'credentials', label:'Credentials' },
  { id:'jobs',        label:'Job Matches' },
];

function TopNav({ active, onNav }) {
  return (
    <nav style={{ background:'#fff', borderBottom:'1px solid #E2E8F0', position:'sticky', top:0, zIndex:40, boxShadow:'0 1px 4px rgba(0,0,0,.05)' }}>
      <div className="r-nav">
        <div style={{ flexShrink:0, marginRight:'auto' }}><Logo/></div>
        <div className="r-navlinks">
          {NAV.map(n => {
            const on = active===n.id;
            return (
              <button key={n.id} onClick={()=>onNav(n.id)} className="nav-link btn"
                style={{ padding:'0 18px', height:60, border:'none', background:'transparent', color:on?C.navy:'#6B7280', fontWeight:on?700:500, fontSize:14, fontFamily:'inherit', position:'relative', borderBottom:on?`2.5px solid ${C.teal}`:'2.5px solid transparent' }}>
                {n.label}
              </button>
            );
          })}
        </div>
        <div className="r-navright">
          {/* Home link */}
          <a href="../index.html" className="btn" style={{ padding:'6px 14px', borderRadius:8, background:'#F8FAFC', border:'1px solid #E2E8F0', fontSize:12, fontWeight:700, color:C.gray, textDecoration:'none' }}>
            ← Home
          </a>
          {/* Notification count as text chip — no bell icon */}
          <button className="btn" style={{ position:'relative', padding:'6px 14px', borderRadius:8, background:'#F8FAFC', border:'1px solid #E2E8F0', fontSize:12, fontWeight:700, color:C.gray }}>
            Alerts
            <span style={{ position:'absolute', top:-5, right:-5, minWidth:17, height:17, borderRadius:99, background:C.red, border:'2px solid #fff', display:'inline-flex', alignItems:'center', justifyContent:'center', color:'#fff', fontSize:9, fontWeight:900, padding:'0 4px' }}>1</span>
          </button>
          <button onClick={()=>onNav('profile')} className="btn" style={{ width:36, height:36, borderRadius:'50%', background:C.teal, border:'none', color:'#fff', fontWeight:800, fontSize:13, letterSpacing:'.3px' }}>
            MR
          </button>
        </div>
        {/* Mobile: avatar + home only */}
        <div className="r-mob-nav" style={{ alignItems:'center', gap:10, marginLeft:'auto' }}>
          <a href="../index.html" className="btn" style={{ padding:'6px 12px', borderRadius:8, background:'#F8FAFC', border:'1px solid #E2E8F0', fontSize:12, fontWeight:700, color:C.gray, textDecoration:'none' }}>← Home</a>
          <button onClick={()=>onNav('profile')} className="btn" style={{ width:34, height:34, borderRadius:'50%', background:C.teal, border:'none', color:'#fff', fontWeight:800, fontSize:12 }}>MR</button>
        </div>
      </div>
      {/* Mobile bottom tab bar */}
      <div className="r-mob-nav" style={{ borderTop:'1px solid #E2E8F0', overflowX:'auto', WebkitOverflowScrolling:'touch' }}>
        {NAV.map(n => {
          const on = active===n.id;
          return (
            <button key={n.id} onClick={()=>onNav(n.id)} className="btn"
              style={{ flex:'0 0 auto', padding:'10px 16px', border:'none', borderTop: on?`2.5px solid ${C.teal}`:'2.5px solid transparent', background:'transparent', color:on?C.navy:'#6B7280', fontWeight:on?700:500, fontSize:12, fontFamily:'inherit', whiteSpace:'nowrap' }}>
              {n.label}
            </button>
          );
        })}
      </div>
    </nav>
  );
}

const PageHeader = ({ title, subtitle, right }) => (
  <div className="r-ph" style={{ background:'#fff', borderBottom:'1px solid #E2E8F0', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
    <div>
      <div style={{ fontSize:20, fontWeight:800, color:'#111827', letterSpacing:'-.3px' }}>{title}</div>
      {subtitle && <div style={{ fontSize:12, color:C.gray, marginTop:3 }}>{subtitle}</div>}
    </div>
    {right && <div style={{ display:'flex', alignItems:'center', gap:10 }}>{right}</div>}
  </div>
);

/* ══ SCREEN 1 — DASHBOARD ══ */
const LEVELS = ['Awareness','Foundational','Working','Advanced','Expert'];
const COMPETENCIES = [
  { name:'Communication',  level:4, color:C.teal   },
  { name:'SQL',            level:2, color:C.sky    },
  { name:'Python',         level:1, color:C.purple },
  { name:'Data Analytics', level:2, color:C.warn   },
  { name:'Cybersecurity',  level:1, color:C.red    },
];

function Dashboard() {
  return (
    <div className="fade-in">
      <div className="r-page" style={{ maxWidth:1100, margin:'0 auto' }}>

        {/* HERO — pure typography, no icons */}
        <div style={{ textAlign:'center', marginBottom:44 }}>
          <h1 className="r-hero-h1" style={{ fontFamily:"'DM Serif Display', Georgia, serif", fontWeight:400, color:'#111827', letterSpacing:'-.8px', lineHeight:1.15, marginBottom:14 }}>
            Maligayang pagdating, Maria!
          </h1>
          <p style={{ fontSize:17, color:C.gray, marginBottom:28, lineHeight:1.6 }}>
            You are <strong style={{ color:C.teal, fontSize:20 }}>35%</strong> toward your <strong style={{ color:'#111827' }}>Data Analyst</strong> certification. Keep going — <em>kaya mo!</em>
          </p>
          {/* Stat chips — number bold, label light, no icons */}
          <div style={{ display:'flex', justifyContent:'center', gap:10, flexWrap:'wrap' }}>
            {[
              { num:'7',   unit:'day streak',         c:'#92400E', bg:'#FEF3C7', border:'#FDE68A' },
              { num:'280', unit:'XP this week',       c:'#1E40AF', bg:'#EFF6FF', border:'#BFDBFE' },
              { num:'2',   unit:'badges earned',      c:'#5B21B6', bg:'#F5F3FF', border:'#DDD6FE' },
              { num:'3',   unit:'days to checkpoint', c:'#991B1B', bg:'#FEF2F2', border:'#FECACA' },
            ].map(p=>(
              <span key={p.unit} style={{ display:'inline-flex', alignItems:'baseline', gap:5, background:p.bg, border:`1px solid ${p.border}`, borderRadius:99, padding:'8px 20px' }}>
                <span style={{ fontSize:17, fontWeight:900, color:p.c }}>{p.num}</span>
                <span style={{ fontSize:13, fontWeight:500, color:p.c }}>{p.unit}</span>
              </span>
            ))}
          </div>
        </div>

        {/* ALERT — left accent stripe + text, no icon */}
        <div style={{ background:'#FFFBEB', border:'1.5px solid #FCD34D', borderLeft:`4px solid ${C.warn}`, borderRadius:'0 12px 12px 0', padding:'14px 20px', marginBottom:28, display:'flex', alignItems:'center', gap:16 }}>
          <div style={{ flex:1 }}>
            <span style={{ fontWeight:800, color:'#92400E', fontSize:13, textTransform:'uppercase', letterSpacing:'.5px' }}>Due in 3 days — </span>
            <span style={{ fontWeight:600, color:'#78350F', fontSize:13 }}>Validation Assessment: M1 Excel Fundamentals. Complete your review before April 4 to unlock Module 2.</span>
          </div>
          <button className="btn" style={{ flexShrink:0, background:'#92400E', color:'#fff', border:'none', borderRadius:8, padding:'9px 18px', fontSize:12, fontWeight:700 }}>Prepare Now</button>
        </div>

        {/* MAIN CARDS */}
        <div className="r-grid-2" style={{ }}>

          <Card style={{ padding:30 }}>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20 }}>
              <span style={{ fontSize:14, fontWeight:700, color:'#111827' }}>Skill Profile</span>
              <Tag color={C.teal} bg={C.tealLt} border="#A7F3D0">Updated today</Tag>
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:20, marginBottom:24 }}>
              <Ring pct={72} size={96} stroke={9} color={C.teal}>
                <div>
                  <div style={{ fontSize:22, fontWeight:900, color:C.navy }}>72%</div>
                  <div style={{ fontSize:8.5, color:C.gray, fontWeight:700, letterSpacing:'.8px' }}>COMPLETE</div>
                </div>
              </Ring>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:12, color:C.gray, marginBottom:10, fontWeight:500 }}>Profile Completeness</div>
                <div style={{ marginBottom:7 }}><Tag color={C.teal} bg={C.tealLt} border="#A7F3D0">+3 certs via Credly</Tag></div>
                <Tag color={C.sky} bg={C.skyLt} border="#BFDBFE">AI-assessed</Tag>
              </div>
            </div>
            {COMPETENCIES.map(c=>(
              <div key={c.name} style={{ marginBottom:12 }}>
                <div style={{ display:'flex', justifyContent:'space-between', marginBottom:4 }}>
                  <span style={{ fontSize:12, fontWeight:600, color:'#374151' }}>{c.name}</span>
                  <span style={{ fontSize:11, fontWeight:700, color:c.color }}>Level {c.level} — {LEVELS[c.level-1]}</span>
                </div>
                <Bar pct={c.level/5*100} color={c.color} h={7}/>
              </div>
            ))}
            <div style={{ fontSize:10, color:'#9CA3AF', marginTop:8, textAlign:'center', lineHeight:1.8 }}>
              1 Awareness · 2 Foundational · 3 Working · 4 Advanced · 5 Expert
            </div>
            <div style={{ fontSize:10.5, color:'#9CA3AF', marginTop:4, textAlign:'right', fontWeight:500 }}>Showing 5 of 12 assessed dimensions</div>
            <button className="btn" style={{ marginTop:16, width:'100%', border:`1.5px solid #E2E8F0`, background:'transparent', color:C.navy, borderRadius:9, padding:'10px', fontSize:13, fontWeight:700 }}>
              View Full Assessment →
            </button>
          </Card>

          <Card style={{ padding:30, display:'flex', flexDirection:'column' }}>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:6 }}>
              <span style={{ fontSize:14, fontWeight:700, color:'#111827' }}>Active Pathway</span>
              <span style={{ fontSize:26, fontWeight:900, color:C.teal }}>35%</span>
            </div>
            <div style={{ fontSize:16, fontWeight:800, color:'#111827', marginBottom:4 }}>Customer Service Agent → Data Analyst</div>
            <div style={{ fontSize:12, color:C.gray, marginBottom:16 }}>Est. completion: September 2026 · 5 months remaining</div>
            <Bar pct={35} color={C.teal} h={10}/>

            {/* Step tracker — M-numbers only, states conveyed by color/border */}
            <div style={{ display:'flex', alignItems:'center', gap:8, marginTop:20 }}>
              <div style={{ width:36, height:36, borderRadius:'50%', background:C.teal, display:'flex', alignItems:'center', justifyContent:'center', color:'#fff', fontSize:11, fontWeight:900, flexShrink:0 }}>M1</div>
              <div style={{ height:2, background:C.teal, flex:1 }}/>
              <div style={{ position:'relative', flexShrink:0 }}>
                <div style={{ width:36, height:36, borderRadius:'50%', background:'#EFF6FF', border:`2.5px solid ${C.sky}`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:900, color:C.sky }}>M2</div>
                <span className="pulse-dot" style={{ position:'absolute', top:-2, right:-2, width:9, height:9, borderRadius:'50%', background:C.sky, border:'2px solid #fff' }}/>
              </div>
              {['M3','M4','M5','M6'].map(m=>(
                <React.Fragment key={m}>
                  <div style={{ height:2, background:'#E2E8F0', flex:1 }}/>
                  <div style={{ width:36, height:36, borderRadius:'50%', background:'#F3F4F6', display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700, color:'#9CA3AF', flexShrink:0 }}>{m}</div>
                </React.Fragment>
              ))}
            </div>
            <div style={{ display:'flex', fontSize:10.5, color:'#9CA3AF', marginTop:7, fontWeight:500 }}>
              <span style={{ marginLeft:4 }}>Completed</span>
              <span style={{ margin:'0 auto' }}>In Progress</span>
              <span>Locked</span>
            </div>

            {/* Milestone — accent left border instead of icon */}
            <div style={{ marginTop:20, background:C.tealLt, borderLeft:`4px solid ${C.teal}`, borderRadius:'0 10px 10px 0', padding:'13px 16px' }}>
              <div style={{ fontSize:10, fontWeight:800, color:C.teal, textTransform:'uppercase', letterSpacing:'.7px', marginBottom:3 }}>Next Milestone</div>
              <div style={{ fontSize:14, fontWeight:800, color:C.navy }}>SQL Fundamentals Badge</div>
              <div style={{ fontSize:11, color:C.gray, marginTop:2 }}>Complete M2 + pass checkpoint to unlock</div>
            </div>
          </Card>
        </div>

        {/* BOTTOM ROW */}
        <div className="r-grid-2b" style={{ }}>
          <Card style={{ padding:26 }}>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:8 }}>
                <Tag color={C.sky} bg={C.skyLt} border="#BFDBFE">IN PROGRESS</Tag>
                <span style={{ fontSize:11, color:'#9CA3AF', fontWeight:500 }}>Module 2 of 6</span>
              </div>
              <div style={{ fontSize:16, fontWeight:800, color:'#111827', marginBottom:4 }}>M2 — Introduction to SQL</div>
              <div style={{ fontSize:12, color:C.gray, marginBottom:12, lineHeight:1.5 }}>SELECT, WHERE, JOINs, aggregation functions · Credly badge upon completion</div>
              <div style={{ fontSize:12, color:C.gray, marginBottom:14, fontWeight:500 }}>25 min · Week 1 of 2</div>
              <Bar pct={20} color={C.sky} h={7} bg="#DBEAFE"/>
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginTop:6, marginBottom:16 }}>
                <span style={{ fontSize:12, fontWeight:800, color:C.sky }}>20% complete</span>
                <button className="btn" style={{ background:C.teal, color:'#fff', border:'none', borderRadius:9, padding:'10px 20px', fontSize:13, fontWeight:700 }}>Continue Learning →</button>
              </div>
              {/* Fix 5 — Lesson structure */}
              <div style={{ borderTop:'1px solid #F3F4F6', paddingTop:14 }}>
                <div style={{ fontSize:10, fontWeight:800, color:'#9CA3AF', textTransform:'uppercase', letterSpacing:'.6px', marginBottom:8 }}>What's in each lesson</div>
                {[
                  { type:'Video walkthrough',   time:'5–10 min',  note:'BPO-contextualized examples' },
                  { type:'Written guide',        time:'Reference', note:'Downloadable for offline use' },
                  { type:'Practice exercise',    time:'15–20 min', note:'Real call center datasets'    },
                  { type:'Self-check',           time:'3–5 Qs',    note:'Formative, not gated'         },
                ].map(l=>(
                  <div key={l.type} style={{ display:'flex', alignItems:'baseline', gap:8, marginBottom:5 }}>
                    <span style={{ fontSize:11, fontWeight:600, color:'#374151', minWidth:140 }}>{l.type}</span>
                    <span style={{ fontSize:10, fontWeight:700, color:C.sky, minWidth:60 }}>{l.time}</span>
                    <span style={{ fontSize:10, color:'#9CA3AF' }}>{l.note}</span>
                  </div>
                ))}
              </div>
            </div>
          </Card>

          {/* This Week — big numbers do all the work */}
          <Card style={{ padding:26 }}>
            <div style={{ fontWeight:800, fontSize:14, color:'#111827', marginBottom:20 }}>This Week</div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14 }}>
              {[
                { value:'4.5h', label:'Hours Learned',     color:C.teal   },
                { value:'1',    label:'Modules Completed', color:C.sky    },
                { value:'280',  label:'XP Earned',         color:C.warn   },
                { value:'1',    label:'Workshop Attended',  color:C.purple },
              ].map(s=>(
                <div key={s.label} style={{ background:C.grayLt, borderRadius:10, padding:'14px' }}>

            Earn your <strong>SQL Fundamentals Badge</strong> to unlock <strong>12 more matches</strong> and push your top score from <strong>78% → 91%</strong>.
          </p>
          <button className="btn" style={{ flexShrink:0, background:C.teal, color:'#fff', border:'none', borderRadius:8, padding:'8px 16px', fontSize:12, fontWeight:700 }}>Continue M2 →</button>
        </div>

        <SectionHeader title="Roles You Are Now Qualified For" subtitle={`${JOBS.length} matches based on your credentials and skill profile`}
          action={
            <div style={{ display:'flex', gap:8 }}>
              {['All Roles','Top Matches','Hybrid/Remote'].map((f,i)=>(
                <button key={f} className="btn" style={{ background:i===0?C.navy:'#fff', color:i===0?'#fff':C.gray, border:`1px solid ${i===0?C.navy:'#E2E8F0'}`, borderRadius:8, padding:'7px 14px', fontSize:12, fontWeight:600 }}>{f}</button>
              ))}
            </div>
          }
        />

        <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
          {JOBS.map((j,i)=>(
            <Card key={i} style={{ padding:0, overflow:'hidden', border:i===0?`2px solid ${C.teal}`:'1px solid #E2E8F0' }}>
              <div style={{ display:'flex', alignItems:'stretch' }}>
                {/* Match score — large colored number is the anchor */}
                <div style={{ width:96, background:`${j.matchColor}09`, borderRight:`1px solid ${j.matchColor}18`, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'20px 0', flexShrink:0 }}>
                  <Ring pct={j.match} size={66} stroke={7} color={j.matchColor}>
                    <div style={{ textAlign:'center' }}>
                      <div style={{ fontSize:15, fontWeight:900, color:j.matchColor, lineHeight:1 }}>{j.match}%</div>
                      <div style={{ fontSize:8, color:C.gray, fontWeight:700, letterSpacing:'.5px' }}>MATCH</div>
                    </div>
                  </Ring>
                  {j.hot && <div style={{ marginTop:8 }}><Tag color={C.teal} bg={C.tealLt}>Top</Tag></div>}
                </div>

                <div style={{ flex:1, padding:'20px 24px' }}>
                  <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:14 }}>
                    <div style={{ flex:1 }}>
                      <div style={{ display:'flex', alignItems:'center', gap:10, flexWrap:'wrap', marginBottom:5 }}>
                        <h3 style={{ fontSize:16, fontWeight:800, color:'#111827' }}>{j.role}</h3>
                        {j.hot && <Tag color={C.teal} bg={C.tealLt} border="#A7F3D0">Best Match</Tag>}
                      </div>
                      <div style={{ display:'flex', gap:16, flexWrap:'wrap', fontSize:12, color:C.gray, marginBottom:14 }}>
                        <strong style={{ color:C.navy }}>{j.company}</strong>
                        <span>{j.location}</span>
                        <span>{j.type}</span>
                        <span>{j.work}</span>
                        <strong style={{ color:'#111827' }}>{j.salary}</strong>
                        <span style={{ color:'#9CA3AF' }}>Posted {j.posted}</span>
                      </div>
                      <div style={{ fontSize:11, color:C.gray, fontWeight:700, marginBottom:8, textTransform:'uppercase', letterSpacing:'.4px' }}>Required Credentials</div>
                      <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
                        {j.certs.map((c,ci)=>(
                          <div key={ci} style={{ display:'flex', alignItems:'center', gap:6, background:c.done?C.greenLt:c.partial?C.skyLt:'#F3F4F6', border:`1px solid ${c.done?'#A7F3D0':c.partial?'#BFDBFE':'#E5E7EB'}`, borderRadius:7, padding:'5px 12px', fontSize:11, fontWeight:700, color:c.done?C.green:c.partial?C.sky:'#9CA3AF' }}>
                            <span style={{ fontWeight:900, fontSize:12 }}>{c.done?'✓':c.partial?'½':'—'}</span>
                            {c.name}
                          </div>
                        ))}
                      </div>
                    </div>
                    <div style={{ flexShrink:0, display:'flex', flexDirection:'column', gap:8, alignItems:'flex-end' }}>
                      <button className="btn" style={{ background:j.btnC, color:'#fff', border:'none', borderRadius:9, padding:'11px 22px', fontSize:13, fontWeight:700, whiteSpace:'nowrap' }}>Apply Now →</button>
                      <button className="btn" style={{ background:'transparent', border:`1.5px solid ${j.btnC}30`, color:j.btnC, borderRadius:9, padding:'9px 18px', fontSize:12, fontWeight:600, whiteSpace:'nowrap' }}>Save Job</button>
                    </div>
                  </div>
                </div>
              </div>
            </Card>
          ))}
        </div>

        <div style={{ marginTop:24, textAlign:'center', padding:'32px 24px', border:'2px dashed #E2E8F0', borderRadius:14, background:'#FAFAFA' }}>
          <div style={{ fontSize:40, fontWeight:900, color:'#D1D5DB', lineHeight:1, marginBottom:8 }}>+12</div>
          <div style={{ fontWeight:700, color:'#374151', fontSize:15 }}>more jobs unlock with the SQL Fundamentals Badge</div>
          <div style={{ color:C.gray, fontSize:13, marginTop:4 }}>Roles at Telus International, iQor, and TTEC Philippines are waiting for you.</div>
          <button className="btn" style={{ marginTop:16, background:C.navy, color:'#fff', border:'none', borderRadius:9, padding:'11px 26px', fontSize:13, fontWeight:700 }}>Continue Learning to Unlock →</button>
        </div>
      </div>
    </div>
  );
}

/* ══ SCREEN 6 — PROFILE ══ */
function Profile({ onNav }) {
  return (
    <div className="fade-in">
      <PageHeader title="My Profile" subtitle="Maria Reyes · BPO Career Upskilling"/>
      <div className="r-page-sm" style={{ maxWidth:760, margin:'0 auto' }}>
        <Card style={{ padding:30, marginBottom:18 }}>
          <div style={{ display:'flex', alignItems:'center', gap:20, marginBottom:26 }}>
            <Avatar initials="MR" size={80} bg={C.teal} fs={26}/>
            <div>
              <div style={{ fontSize:22, fontWeight:900, color:'#111827' }}>Maria Reyes</div>
              <div style={{ fontSize:14, color:C.gray, marginTop:2 }}>Customer Service Agent · Concentrix Manila</div>
              <div style={{ display:'flex', gap:8, marginTop:10 }}>
                <Tag color={C.teal} bg={C.tealLt} border="#A7F3D0">Credly Connected</Tag>
                <Tag color={C.sky} bg={C.skyLt} border="#BFDBFE">TESDA Registered</Tag>
              </div>
            </div>
            <button className="btn" style={{ marginLeft:'auto', background:C.navy, color:'#fff', border:'none', borderRadius:9, padding:'10px 20px', fontSize:13, fontWeight:700 }}>Edit Profile</button>
          </div>
          {[
            ['Full Name','Maria Santos Reyes'],['Email','maria.reyes@skillbridgeph.com'],
            ['BPO Company','Concentrix Manila (BGC)'],['Work Experience','3 years in Customer Service'],
            ['Education','BS Business Administration – FEU Manila, 2021'],['Location','Quezon City, Metro Manila'],
            ['SkillBridge Level','Level 3 — Intermediate Upskiller'],
          ].map(([k,v])=>(
            <div key={k} style={{ display:'flex', borderBottom:'1px solid #F3F4F6', padding:'12px 0', gap:16 }}>
              <div style={{ width:180, fontSize:12, color:'#9CA3AF', fontWeight:600 }}>{k}</div>
              <div style={{ flex:1, fontSize:13, fontWeight:600, color:'#374151' }}>{v}</div>
            </div>
          ))}
        </Card>
        <div style={{ display:'flex', gap:12 }}>
          <button onClick={()=>onNav('settings')} className="btn" style={{ background:'#fff', color:C.navy, border:`1.5px solid #E2E8F0`, borderRadius:9, padding:'10px 20px', fontSize:13, fontWeight:700 }}>Settings</button>
          <button className="btn" style={{ background:C.teal, color:'#fff', border:'none', borderRadius:9, padding:'10px 20px', fontSize:13, fontWeight:700 }}>Export Profile</button>
        </div>
      </div>
    </div>
  );
}

/* ══ SCREEN 7 — SETTINGS ══ */
function Settings() {
  const [notif,setNotif]=useState(true), [remind,setRemind]=useState(true), [credly,setCredy]=useState(true);
  const Toggle=({on,onToggle})=>(
    <div onClick={onToggle} style={{ width:44, height:24, borderRadius:99, background:on?C.teal:'#E5E7EB', cursor:'pointer', position:'relative', transition:'background .2s', flexShrink:0 }}>
      <div style={{ position:'absolute', top:3, left:on?23:3, width:18, height:18, borderRadius:'50%', background:'#fff', boxShadow:'0 1px 3px rgba(0,0,0,.2)', transition:'left .2s' }}/>
    </div>
  );
  return (
    <div className="fade-in">
      <PageHeader title="Settings" subtitle="Manage your SkillBridge PH preferences"/>
      <div className="r-page-sm" style={{ maxWidth:680, margin:'0 auto' }}>
        {[
          { title:'Notifications', items:[
            { label:'Push Notifications', sub:'Module reminders, checkpoint alerts', on:notif, set:setNotif },
            { label:'Daily Learning Reminders', sub:'Get reminded to hit your daily goal', on:remind, set:setRemind },
          ]},
          { title:'Integrations', items:[
            { label:'Credly Badge Sync', sub:'Auto-sync earned badges to your Credly profile', on:credly, set:setCredy },
          ]},
        ].map(g=>(
          <Card key={g.title} style={{ padding:24, marginBottom:16 }} hover={false}>
            <div style={{ fontWeight:800, color:'#111827', fontSize:14, marginBottom:16 }}>{g.title}</div>
            {g.items.map(item=>(
              <div key={item.label} style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'12px 0', borderBottom:'1px solid #F3F4F6', gap:12 }}>
                <div>
                  <div style={{ fontSize:13, fontWeight:600, color:'#374151' }}>{item.label}</div>
                  <div style={{ fontSize:11, color:'#9CA3AF', marginTop:2 }}>{item.sub}</div>
                </div>
                <Toggle on={item.on} onToggle={()=>item.set(v=>!v)}/>
              </div>
            ))}
          </Card>
        ))}
        <Card style={{ padding:24 }} hover={false}>
          <div style={{ fontWeight:800, color:'#111827', fontSize:14, marginBottom:16 }}>Account</div>
          {['Change Password','Export My Data','Delete Account'].map((a,i)=>(
            <button key={a} className="btn" style={{ display:'block', width:'100%', textAlign:'left', background:'transparent', border:'none', borderBottom:i<2?'1px solid #F3F4F6':'none', padding:'12px 0', fontSize:13, fontWeight:600, color:i===2?C.red:'#374151', fontFamily:'inherit' }}>{a} →</button>
          ))}
        </Card>
      </div>
    </div>
  );
}

/* ══ APP ROOT ══ */
function App() {
  const [screen,setScreen]=useState('dashboard');
  const SCREENS={
    dashboard:<Dashboard/>, careermap:<CareerMap/>, modules:<LearningModules/>,
    credentials:<Credentials/>, jobs:<JobMatches/>, profile:<Profile onNav={setScreen}/>, settings:<Settings/>,
  };
  return (
    <div style={{ display:'flex', flexDirection:'column', minHeight:'100vh', fontFamily:"'Inter', system-ui, sans-serif" }}>
      <TopNav active={screen} onNav={setScreen}/>
      <main style={{ flex:1, overflowY:'auto', background:C.bg }}>{SCREENS[screen]||<Dashboard/>}</main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
